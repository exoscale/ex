name: Clojure CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    -  uses: actions/setup-java@v6.2.0
       with:
         java-version: '11'
         distribution: 'zulu'
         architecture: 'x64'

    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        lein: 2.9.1
         
    - name: Install dependencies
      run: lein sub install
      
    - name: Run tests
      run: lein sub test
